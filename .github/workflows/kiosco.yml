name: kiosco

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # POR QUE CADA PASO ESCRIBE UN LOG Y UN .exit:
      # el run anterior fallo y lo unico visible sin autenticarse fue "Process
      # completed with exit code 1". Eso es saber que fallo sin saber donde, o
      # sea un NO MEDIDO con forma de falla. El paso final del job vuelca estos
      # archivos al Summary, que si es publico.
      #
      # set +e y PIPESTATUS son necesarios, no decorativos: con el -e por
      # defecto de GitHub el script aborta antes de escribir el .exit, y el
      # registro del fallo se pierde justo cuando importa.

      # Los tests de logica NO necesitan dependencias: usan solo la libreria
      # estandar de Node. Corren primero porque dan el diagnostico mas rapido.
      - name: tests de logica
        run: |
          set +e
          node --test test/*.test.mjs 2>&1 | tee /tmp/kiosco-01-tests.log
          codigo=${PIPESTATUS[0]}
          echo $codigo > /tmp/kiosco-01-tests.exit
          exit $codigo

      # El paso que hace que el de arriba signifique algo: rompe el codigo a
      # proposito y EXIGE que la suite se ponga roja. Incluye los sabotajes de
      # NEGOCIO, que son los que un test de formato no ve.
      - name: sabotaje obligatorio
        run: |
          set +e
          bash tools/sabotaje.sh 2>&1 | tee /tmp/kiosco-02-sabotaje.log
          codigo=${PIPESTATUS[0]}
          echo $codigo > /tmp/kiosco-02-sabotaje.exit
          exit $codigo

      - name: el arbol quedo limpio despues del sabotaje
        run: |
          set +e
          git diff --exit-code 2>&1 | tee /tmp/kiosco-03-arbol.log
          codigo=${PIPESTATUS[0]}
          echo $codigo > /tmp/kiosco-03-arbol.exit
          exit $codigo

      # ESTE ES EL TESTIGO INDEPENDIENTE del protocolo MCP.
      # El entorno donde se escribio el codigo no tiene red ni npm, asi que
      # todo lo que dependa del SDK era NO MEDIDO ahi. Aca se instalan los
      # paquetes reales y se hace un handshake completo: initialize,
      # tools/list y tools/call. Si el SDK v2 no fuera compatible con el
      # handler stateless, falla aca y no en produccion.
      - name: instalar dependencias reales
        run: |
          set +e
          npm install --no-audit --no-fund 2>&1 | tee /tmp/kiosco-04-npm.log
          codigo=${PIPESTATUS[0]}
          echo $codigo > /tmp/kiosco-04-npm.exit
          exit $codigo

      - name: test del protocolo MCP real
        run: |
          set +e
          node --test test-integracion/*.test.mjs 2>&1 | tee /tmp/kiosco-05-protocolo.log
          codigo=${PIPESTATUS[0]}
          echo $codigo > /tmp/kiosco-05-protocolo.exit
          exit $codigo

      # Lo mas cerca del deploy sin desplegar: wrangler valida la config,
      # arma el bundle y resuelve las dependencias.
      - name: dry-run del deploy
        run: |
          set +e
          npx wrangler deploy --dry-run --outdir=/tmp/kiosco-build 2>&1 | tee /tmp/kiosco-06-dryrun.log
          codigo=${PIPESTATUS[0]}
          echo $codigo > /tmp/kiosco-06-dryrun.exit
          exit $codigo

      # El limite de un Worker en el plan gratis es 3 MB. Si el bundle se
      # acerca, conviene saberlo antes de que el deploy lo rechace.
      - name: tamano del bundle
        run: |
          set +e
          {
            bytes=$(find /tmp/kiosco-build -name '*.js' -exec cat {} + | wc -c)
            echo bundle en bytes: $bytes
            if [ "$bytes" -gt 2500000 ]; then
              echo FALLA: el bundle supera 2,5 MB y el limite del plan gratis es 3 MB
              exit 1
            fi
            echo OK: por debajo del limite de 2,5 MB
          } 2>&1 | tee /tmp/kiosco-07-bundle.log
          codigo=${PIPESTATUS[0]}
          echo $codigo > /tmp/kiosco-07-bundle.exit
          exit $codigo

      # EL PASO QUE HACE PUBLICO EL DIAGNOSTICO.
      # Corre SIEMPRE, incluso despues de una falla, y distingue tres estados
      # por paso. La tercera fila es la que faltaba: sin ella, un paso que
      # nunca se ejecuto se lee igual que uno que paso.
      - name: resumen publico del run
        if: always()
        run: |
          set +e
          resumen="$GITHUB_STEP_SUMMARY"
          echo "## Verificacion del kiosco" >> "$resumen"
          echo "" >> "$resumen"
          echo "| paso | estado |" >> "$resumen"
          echo "| --- | --- |" >> "$resumen"
          for paso in 01-tests 02-sabotaje 03-arbol 04-npm 05-protocolo 06-dryrun 07-bundle; do
            if [ -f "/tmp/kiosco-$paso.exit" ]; then
              c=$(cat "/tmp/kiosco-$paso.exit")
              if [ "$c" = "0" ]; then
                echo "| $paso | paso (exit 0) |" >> "$resumen"
              else
                echo "| $paso | FALLO (exit $c) |" >> "$resumen"
              fi
            else
              echo "| $paso | NO CORRIO |" >> "$resumen"
            fi
          done
          echo "" >> "$resumen"
          for paso in 01-tests 02-sabotaje 03-arbol 04-npm 05-protocolo 06-dryrun 07-bundle; do
            archivo="/tmp/kiosco-$paso.log"
            if [ -f "$archivo" ]; then
              c=$(cat "/tmp/kiosco-$paso.exit" 2>/dev/null || echo "sin_exit")
              echo "### $paso (exit $c)" >> "$resumen"
              echo '```' >> "$resumen"
              tail -40 "$archivo" >> "$resumen"
              echo '```' >> "$resumen"
              echo "" >> "$resumen"
            else
              echo "### $paso" >> "$resumen"
              echo "NO CORRIO: el job abortó antes de llegar a este paso." >> "$resumen"
              echo "" >> "$resumen"
            fi
          done
          exit 0
