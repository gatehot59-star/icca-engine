name: kiosco

# El disparo era push a '**' MAS pull_request, asi que cada commit de una rama
# con PR corria el workflow dos veces. Sumado a que los dos workflows llamaban
# "verificar" a su job, el commit 1b34913 quedo con cuatro check runs con el
# mismo nombre y ninguna forma de saber cual era cual.
on:
  pull_request:
    paths:
      - 'kiosco/**'
      - '.github/workflows/kiosco.yml'
      - '.github/scripts/paso.sh'
  push:
    branches: [main]
    paths:
      - 'kiosco/**'
      - '.github/workflows/kiosco.yml'
      - '.github/scripts/paso.sh'

permissions:
  contents: read

concurrency:
  group: kiosco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiosco:
    # El nombre del job ES el nombre del check run. Con dos workflows llamando
    # "verificar" a su job, el estado del commit era ilegible.
    name: kiosco
    runs-on: ubuntu-latest
    env:
      DIR_PASOS: ${{ runner.temp }}/pasos-kiosco
      PASO: ${{ github.workspace }}/.github/scripts/paso.sh
    defaults:
      run:
        working-directory: kiosco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Los tests de logica NO necesitan dependencias: usan solo la libreria
      # estandar de Node. Corren primero porque dan el diagnostico mas rapido.
      - name: 01 tests de logica
        run: bash "$PASO" correr 01-tests 'node --test test/*.test.mjs'

      # El paso que hace que el de arriba signifique algo: rompe el codigo a
      # proposito y EXIGE que la suite se ponga roja. Incluye los sabotajes de
      # NEGOCIO, que son los que un test de formato no ve.
      - name: 02 sabotaje obligatorio
        run: bash "$PASO" correr 02-sabotaje 'bash tools/sabotaje.sh'

      - name: 03 el arbol quedo limpio despues del sabotaje
        run: bash "$PASO" correr 03-arbol 'git diff --exit-code'

      # RESOLUCION ANTES DE INSTALAR. agents 0.21.0 pide como peers NO
      # opcionales @modelcontextprotocol/sdk 1.30.0 y
      # @modelcontextprotocol/client 2.0.0, y el package.json no declara
      # ninguno de los dos. Verificado en vivo el 2026-08-22 en
      # registry.npmjs.org: los rangos de zod son compatibles, asi que no hay
      # conflicto evidente. "No evidente" no es "medido": esto lo mide, y su
      # salida queda en la anotacion si falla.
      - name: 04 resolucion de dependencias, sin escribir nada
        run: bash "$PASO" correr 04-resolucion 'npm install --dry-run --no-audit --no-fund'

      - name: 05 instalar dependencias reales
        run: bash "$PASO" correr 05-npm 'npm install --no-audit --no-fund'

      # Evidencia cruda de QUE quedo instalado. Sin esto, un fallo del protocolo
      # no distingue "el codigo esta mal" de "se instalo otra version".
      - name: 06 versiones que quedaron instaladas
        run: bash "$PASO" correr 06-versiones 'npm ls --depth=0 || true; npm ls @modelcontextprotocol/server @modelcontextprotocol/sdk zod agents || true'

      # ESTE ES EL TESTIGO INDEPENDIENTE del protocolo MCP. El entorno donde se
      # escribio el codigo no tiene red ni npm, asi que todo lo que dependa del
      # SDK era NO MEDIDO ahi. Aca se hace el handshake completo: initialize,
      # tools/list y tools/call.
      - name: 07 test del protocolo MCP real
        run: bash "$PASO" correr 07-protocolo 'node --test test-integracion/*.test.mjs'

      # Lo mas cerca del deploy sin desplegar: wrangler valida la config, arma
      # el bundle y resuelve las dependencias.
      - name: 08 dry-run del deploy
        run: bash "$PASO" correr 08-dryrun 'npx wrangler deploy --dry-run --outdir="$DIR_PASOS/build"'

      # El limite de un Worker en el plan gratis es 3 MB. Si el bundle se
      # acerca, conviene saberlo antes de que el deploy lo rechace.
      #
      # El guard distingue tres estados: si el directorio no existe o no tiene
      # un solo .js, NO dice "0 bytes, todo bien". Un find sin resultados y un
      # bundle vacio se leen igual y no son lo mismo.
      - name: 09 tamano del bundle
        run: |
          bash "$PASO" correr 09-bundle 'set -u
            dir="$DIR_PASOS/build"
            if [ ! -d "$dir" ]; then echo "NO MEDIDO: no existe $dir, el dry-run no dejo bundle"; exit 1; fi
            n=$(find "$dir" -name "*.js" | wc -l)
            if [ "$n" -eq 0 ]; then echo "NO MEDIDO: no hay ningun .js en $dir"; exit 1; fi
            bytes=$(find "$dir" -name "*.js" -exec cat {} + | wc -c)
            echo "archivos: $n"
            echo "bundle en bytes: $bytes"
            if [ "$bytes" -gt 2500000 ]; then echo "FALLA: supera 2,5 MB y el limite del plan gratis es 3 MB"; exit 1; fi
            echo "OK: por debajo del limite de 2,5 MB"'

      # EL PASO QUE HACE PUBLICO EL DIAGNOSTICO. Corre siempre, incluso despues
      # de una falla, y declara los pasos que NO CORRIERON: sin esa fila, un
      # paso que el job nunca alcanzo se lee igual que uno que paso.
      - name: cierre publico del run
        if: always()
        run: bash "$PASO" cierre 01-tests 02-sabotaje 03-arbol 04-resolucion 05-npm 06-versiones 07-protocolo 08-dryrun 09-bundle
